<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logos · Gizlilik Politikası</title>
<link rel="icon" href="assets/icons/icon-192.png">
<style>
:root{--bg:#0e1124;--panel:#161a33;--ink:#ebe8f3;--muted:#a2a7c8;--line:#2a3058;--blue:#8496e0;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-left)) 48px}
main{max-width:760px;margin:0 auto}h1{font-size:24px}h3{color:var(--blue);margin:24px 0 6px;font-size:16px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid var(--line);padding:6px 8px;text-align:start;vertical-align:top}th{background:var(--panel)}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}nav a{color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;text-decoration:none}nav a[aria-current]{color:var(--ink);border-color:var(--blue)}
.doldur{background:#d65a4f33;border-radius:3px;padding:0 3px}a{color:var(--blue)}
</style></head><body><main>
<img src="assets/ui/logo.webp" alt="" width="56" height="56">
<nav><a href="#gizlilik">Gizlilik Politikası</a><a href="#aydinlatma">KVKK Aydınlatma Metni</a><a href="#kosullar">Kullanım Koşulları</a><a href="hesap-sil.html">Hesap silme</a></nav>
<article id="m"><p>Yükleniyor…</p></article>
</main>
<script>
let H={};const goster=()=>{const k=(location.hash.slice(1)||"gizlilik");const b=H[k]||H.gizlilik;if(!b)return;document.getElementById("m").innerHTML=`<h1>${b.baslik}</h1>${b.html}`;document.title="Logos · "+b.baslik;document.querySelectorAll("nav a[href^='#']").forEach(a=>a.toggleAttribute("aria-current",a.getAttribute("href")==="#"+k));};
fetch("data/hukuk/tr.json").then(r=>r.json()).then(j=>{H=j;goster();}).catch(()=>{document.getElementById("m").innerHTML="<p>Metin yüklenemedi. İletişim: cekirdekdijital@gmail.com</p>";});
addEventListener("hashchange",goster);
</script></body></html>
